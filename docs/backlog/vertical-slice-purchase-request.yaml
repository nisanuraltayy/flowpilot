  - id: FP-E04-002
    title: PostgreSQL Row Level Security politikaları
    epic_id: E04
    persona: engineer
    user_story: >
      Bir geliştirici olarak, uygulama filtresini unutsam bile veritabanının beni durdurmasını
      istiyorum; böylece tek bir insan hatası veri sızıntısına dönüşmesin.
    business_value: "İkinci bağımsız savunma katmanı. Sızıntı için iki ayrı hata gerekir."
    scope:
      - Her tenant tablosunda RLS politikası
      - DB session'ının tenant context ile açılması
      - Uygulama rolünün BYPASSRLS yetkisi OLMAMASI
      - Worker bağlantılarının da RLS'e tabi olması
    out_of_scope:
      - Şema-per-tenant izolasyonu (reddedildi — ADR-006)
    acceptance_criteria:
      - id: AC-1
        given: "Uygulama tenant filtresi BİLİNÇLİ olarak kaldırılmış bir sorgu çalıştırdığında"
        when: "Sorgu RLS altında çalıştığında"
        then: "Yalnız aktif tenant'ın satırları döner; diğer tenant'ın satırları ASLA görünmez"
      - id: AC-2
        given: "Bir worker outbox event işlerken"
        when: "DB session açtığında"
        then: "Session tenant context ile açılır ve RLS'e tabidir"
      - id: AC-3
        given: "Yeni bir tenant tablosu eklendiğinde"
        when: "Migration RLS politikası içermiyorsa"
        then: "CI başarısız olur (FF-04)"
    domain_rules:
      - "RLS uygulama filtresinin YERİNE değil, İKİNCİ katman olarak bulunur"
    security_requirements:
      - "Uygulama BYPASSRLS yetkili rolle bağlanamaz"
      - "RLS politikası her migration'da versiyonlanır"
    audit_requirements: []
    observability_requirements:
      - "Kritik endpoint'lerde query plan regresyonu izlenir (RLS plan etkisi)"
    api_impact: none
    data_model_impact: "Her tenant tablosunda ENABLE ROW LEVEL SECURITY + policy"
    test_cases:
      - "security: filtresiz sorgu RLS tarafından boşa düşürülür"
      - "security: worker RLS'e tabi (BYPASSRLS kullanmıyor)"
      - "integration: RLS politikası her tenant tablosunda aktif"
      - "fitness: FF-04"
    edge_cases:
      - "Migration çalıştıran rolün yetkisi (DDL için ayrı rol)"
      - "RLS'in query plan'ı bozduğu ağır sorgular"
      - "Connection pool'da tenant context'in bir sonraki isteğe SIZMASI — en kritik edge case; her istekte reset edilmeli"
    dependencies: [FP-E04-001]
    definition_of_done:
      - "RLS'in tek başına çalıştığı kanıtlandı (filtresiz sorgu testi)"
      - "Connection pool context sızıntısı testi geçti"
      - "FF-04 aktif"
    complexity: M
    status: draft

