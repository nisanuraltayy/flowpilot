  - id: FP-E06-001
    title: Satın alma talebi domain modeli
    epic_id: E06
    persona: requester
    user_story: >
      Bir çalışan olarak, ürün/hizmet adı, kategori, tutar, para birimi ve gerekçe girerek
      satın alma talebi oluşturmak istiyorum; böylece talebim kayıt altına alınsın ve
      doğru onay zincirine girsin.
    business_value: "İlk dikey dilimin iş değeri. Talep kaybolmaz ve kurallara göre yönlendirilir."
    scope:
      - "PurchaseRequest aggregate: title, category, amount (Money), justification, requester_id"
      - Talep numarası (insan okunabilir, tenant içinde unique)
      - "Talep durumu: draft → submitted → in_approval → approved | rejected | changes_requested"
    out_of_scope:
      - Dosya eki (FP-E06-003)
      - Bütçe kontrolü, tedarikçi yönetimi, PO oluşturma
    acceptance_criteria:
      - id: AC-1
        given: "Zorunlu alanlar doldurulduğunda"
        when: "Talep gönderildiğinde"
        then: "Talep oluşur, workflow instance başlar ve requester'a görünür"
      - id: AC-2
        given: "Bir talep gönderildikten sonra"
        when: "Requester tutarı değiştirmek istediğinde"
        then: "Doğrudan değiştiremez; yalnız changes_requested durumunda izin verilen alanlar açılır"
      - id: AC-3
        given: "Tutar negatif veya sıfır olduğunda"
        when: "Talep gönderildiğinde"
        then: "Reddedilir"
    domain_rules:
      - "Tutar Money value object'idir (minor unit + currency); float YASAK"
      - "Talep gönderildikten sonra form alanları kilitlenir"
      - "Talep numarası tenant içinde unique ve tahmin edilemez olmalı (sıralı DB ID dışarı açılmaz)"
    security_requirements:
      - "purchase_request.create permission'ı gerekir"
      - "Requester yalnız kendi talebini (veya yetkili olduğu talepleri) okuyabilir"
      - "tenant_id istemciden alınmaz"
    audit_requirements:
      - "purchase_request.created — actor, tutar, kategori, snapshot hash"
    observability_requirements:
      - "purchase_request_created_total{category}"
      - "Trace: talep oluşturma → workflow instance start"
    api_impact: "POST /v1/purchase-requests (Idempotency-Key destekli); GET /v1/purchase-requests/{id}"
    data_model_impact: "purchase_requests (id, tenant_id, request_number, title, category, amount_minor, currency, justification, requester_id, status, workflow_instance_id, version); RLS"
    test_cases:
      - "integration: talep oluşturma → instance start atomik"
      - "unit: negatif/sıfır tutar reddedilir"
      - "security: cross-tenant talep okuma reddedilir"
      - "security: member başkasının talebini okuyamaz"
      - "integration: gönderilmiş talebin alanları kilitli"
    edge_cases:
      - "Eşzamanlı çift gönderim (idempotency)"
      - "Çok büyük tutar"
      - "Kategori enum'unda olmayan değer"
    dependencies: [FP-E05-003, FP-E02-003]
    definition_of_done:
      - "Cross-tenant ve ownership testleri geçiyor"
      - "Para float değil (fitness check)"
      - "Audit kaydı yazılıyor"
