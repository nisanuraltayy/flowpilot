  - id: FP-E15-002
    title: Uçtan uca golden test ve demo kanıt paketi
    epic_id: E15
    persona: engineer
    user_story: >
      Bir geliştirici olarak, ilk dikey dilimin uçtan uca ÇALIŞTIĞINI kanıtlamak istiyorum;
      böylece "yarım modüller" yerine gerçek bir süreç teslim edildiği görülsün.
    business_value: >
      PRD'nin talimatı: "Çok sayıda yarım modül yerine bir sürecin uçtan uca çalışması
      tercih edilmelidir."
    scope:
      - "Golden e2e — giriş, organizasyon/membership, talep, koşul, sıralı onay, state transition, notification, audit, timeline"
      - "Alternatif yollar — ret ve değişiklik talebi"
      - "Dayanıklılık — worker restart, duplicate event, duplicate approval"
      - "Güvenlik — cross-tenant erişim"
      - "Demo kanıt paketi (test çıktıları, ekran görüntüleri, API örnekleri)"
    out_of_scope:
      - Yük/soak testi, erişilebilirlik denetimi, DR game day (sonraki faz)
    acceptance_criteria:
      - id: AC-1
        given: "Tutar 10.000 TL üzerinde bir talep"
        when: "İki adımlı onay tamamlandığında"
        then: "Instance completed; talep approved; bildirim ve audit kayıtları eksiksiz; timeline doğru"
      - id: AC-2
        given: "Onay sürecinin ortasında worker öldürüldüğünde"
        when: "Worker yeniden başlatıldığında"
        then: "Süreç doğru tamamlanır; duplicate side effect oluşmaz"
      - id: AC-3
        given: "Aynı onay komutu iki kez gönderildiğinde"
        when: "E2E akış tamamlandığında"
        then: "Tek karar, tek bildirim, tek audit kaydı"
      - id: AC-4
        given: "Tenant A'nın kullanıcısı"
        when: "Tenant B'nin talebine/onayına/dosyasına erişmeye çalıştığında"
        then: "Tüm denemeler reddedilir"
      - id: AC-5
        given: "Bir talep reddedildiğinde"
        when: "Akış tamamlandığında"
        then: "Instance rejected; requester bilgilendirilir; açık task/timer kapanır"
    domain_rules:
      - "Tüm sistem invariant'ları e2e akışta korunur"
    security_requirements:
      - "Cross-tenant, duplicate approval ve yetkisiz karar senaryoları e2e'de test edilir"
      - "Workflow runtime E2E'de MOCK'LANAMAZ (PRD §39: 'Mocking Entire Workflow Engine in E2E' anti-pattern'dir)"
    audit_requirements:
      - "E2E akışta üretilen tüm audit kayıtlarının eksiksizliği doğrulanır"
    observability_requirements:
      - "E2E akışta trace zinciri (talep → instance → onay → bildirim) uçtan uca izlenebilir"
    api_impact: none
    data_model_impact: none
    test_cases:
      - "e2e: happy path (2 adımlı onay)"
      - "e2e: happy path (1 adımlı onay, düşük tutar)"
      - "e2e: ret yolu"
      - "e2e: değişiklik talebi + revizyon + yeniden onay"
      - "resilience: worker restart ortasında akış"
      - "security: duplicate approval → tek karar"
      - "security: duplicate event → tek side effect"
      - "security: cross-tenant erişim reddedilir"
    edge_cases:
      - "Revizyon sonrası tutar eşiğin altına düşerse zincir kısalır"
      - "Onaycı membership'i süreç ortasında suspend edilirse"
      - "İki onaycının eşzamanlı kararı"
    dependencies:
      - FP-E15-001
      - FP-E13-003
      - FP-E14-002
      - FP-E12-002
      - FP-E10-004
      - FP-E06-003
    definition_of_done:
      - "Tüm e2e senaryoları yeşil"
      - "Runtime e2e'de mock'lanmadı"
      - "Demo kanıt paketi üretildi"
      - "MVP çıkış kriterlerinin ilk dilime düşen kısmı karşılandı"
    complexity: L
    status: draft

