  - id: FP-E08-001
    title: Spike harness ve referans akış
    epic_id: E08
    persona: engineer
    user_story: >
      Bir geliştirici olarak, custom runtime'ın 12 kriterini AYNI referans akış üzerinde
      test edebileceğim bir harness kurmak istiyorum; böylece kanıtlar karşılaştırılabilir olsun.
    business_value: "Runtime kararının ucuza ve kanıta dayalı verilmesi."
    scope:
      - "Referans akış: Start → Form → Condition → Sequential Approval → Notification → End"
      - İki tenant, iki onaycı, iki tutar senaryosu (≤10.000 TL ve >10.000 TL)
      - Fake clock, process kill/restart harness'ı, fault injection
      - Kanıt toplama (test çıktısı, DB durumu, log)
    out_of_scope:
      - Üretim kalitesinde kod, UI, gerçek auth provider
      - MVP dışı node'lar
    acceptance_criteria:
      - id: AC-1
        given: "Spike harness'ı kurulduğunda"
        when: "Referans akış çalıştırıldığında"
        then: "Her kriter için tekrarlanabilir kanıt üretilebilir"
      - id: AC-2
        given: "Spike kodu yazıldığında"
        when: "main branch'e bakıldığında"
        then: "Spike kodu üretim kodu olarak merge EDİLMEMİŞTİR"
    domain_rules:
      - "Spike çıktısı KARAR ve KANITTIR, ürün değildir"
    security_requirements:
      - "Spike'ta bile cross-tenant senaryosu test edilir (SPK-10)"
    audit_requirements: []
    observability_requirements:
      - "Timer gecikmesi ve worker lag ölçülebilir olmalı"
    api_impact: none
    data_model_impact: "Spike şeması (üretim migration'ı DEĞİL)"
    test_cases:
      - "Harness: process kill/restart otomatik çalışıyor"
      - "Harness: fake clock ile timer ileri alınabiliyor"
      - "Harness: fault injection commit öncesi hata enjekte edebiliyor"
    edge_cases:
      - "Harness'ın kendisinin flaky olması → kanıt güvenilmez olur; deterministik olmalı"
    dependencies: [FP-E07-003]
    definition_of_done:
      - "Harness deterministik ve tekrarlanabilir"
      - "Referans akış çalışıyor"
    complexity: M
    status: draft

  - id: FP-E08-002
    title: Spike kanıtı — versioning ve determinizm (SPK-01, SPK-02, SPK-03)
    epic_id: E08
    persona: engineer
    user_story: >
      Bir geliştirici olarak, published version'ın immutable olduğunu, instance'ın version'a
      bağlı kaldığını ve condition evaluator'ın deterministik/güvenli olduğunu kanıtlamak istiyorum.
    business_value: "Devam eden süreçlerin güvenliği ve onay yönlendirmesinin doğruluğu."
    scope:
      - "SPK-01: Published workflow version immutable"
      - "SPK-02: Instance belirli version'a bağlı"
      - "SPK-03: Condition node doğru branch'i seçiyor (sınır değerleri, zararlı payload)"
    out_of_scope:
      - Diğer 9 kriter
    acceptance_criteria:
      - id: AC-1
        given: "v1 yayınlanmış ve bir instance beklerken v2 yayınlandığında"
        when: "Bekleyen instance ilerletildiğinde"
        then: "v1 semantiğiyle tamamlanır; v2'den ETKİLENMEZ"
      - id: AC-2
        given: "Tutar tam olarak eşik değerindeyken (9999.99 / 10000.00 / 10000.01)"
        when: "Condition değerlendirildiğinde"
        then: "Doğru branch seçilir ve seçim gerekçesi açıklanabilir"
      - id: AC-3
        given: "Condition ifadesinde zararlı bir payload gönderildiğinde"
        when: "Evaluator çalıştığında"
        then: "Parser tarafından REDDEDİLİR; hiçbir kod çalıştırılmaz"
    domain_rules:
