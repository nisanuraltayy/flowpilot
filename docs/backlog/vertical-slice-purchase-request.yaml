  # ==========================================================================
  # E12 — In-App Notification
  # ==========================================================================

  - id: FP-E12-001
    title: In-app notification üretimi ve deduplication
    epic_id: E12
    persona: approver
    user_story: >
      Bir onaycı olarak, bana onay düştüğünde bildirim almak istiyorum; ama aynı olay için
      iki kez bildirim almak istemiyorum.
    business_value: "Sürecin ilerlediğinin görünür olması. Duplicate bildirim güveni kırar."
    scope:
      - NotificationChannelPort — KANAL-NÖTR port tasarımı (zorunlu; e-posta sonradan adapter olarak eklenecek)
      - Notification modeli (tenant-scoped, recipient, type, payload, read_at)
      - Outbox event consumer (approval.requested, approval.decided, task.created)
      - "Deduplication: aynı business event + recipient + kanal → tek bildirim"
      - MVP'de yalnız in-app adapter uygulanır
    out_of_scope:
      - E-posta adapter'ı → PILOT-READY kapsamında (ASM-0010). Port MVP'de hazır olmalı
      - Slack, push, SMS
      - Digest, kullanıcı tercihleri, unsubscribe
    acceptance_criteria:
      - id: AC-1
        given: "Bir onay adımı aktifleştiğinde"
        when: "Outbox event işlendiğinde"
        then: "Yetkili onaycıya in-app bildirim oluşur"
      - id: AC-2
        given: "Aynı outbox event iki kez işlendiğinde"
        when: "Consumer çalıştığında"
        then: "TEK bildirim oluşur (idempotent inbox + dedup key)"
      - id: AC-3
        given: "Bir bildirim oluşturulduğunda"
        when: "Kullanıcı listelediğinde"
        then: "Yalnız kendi tenant'ının ve kendisine ait bildirimleri görür"
    domain_rules:
      - "Aynı olay için duplicate bildirim önlenir (PRD §9.12)"
      - "Notification modülü diğer modüllerin tablolarını OKUMAZ; event payload'ından beslenir"
      - "NotificationChannelPort kanal-nötrdür: e-posta/Slack eklemek yeni bir ADAPTER olmalı, domain veya port değişikliği DEĞİL"
    security_requirements:
      - "Bildirim payload'ında gereksiz hassas veri taşınmaz"
      - "Cross-tenant bildirim erişimi reddedilir"
    audit_requirements:
      - "notification.requested / created"
    observability_requirements:
      - "notification_created_total; notification_duplicate_suppressed_total"
      - "Bildirim enqueue latency (hedef < 5 s)"
    api_impact: "GET /v1/notifications; POST /v1/notifications/{id}/read"
    data_model_impact: "notifications (id, tenant_id, recipient_user_id, type, payload JSONB, dedup_key, read_at); UNIQUE(dedup_key); RLS"
    test_cases:
      - "integration: duplicate event → tek bildirim"
      - "security: cross-tenant bildirim okunamaz"
      - "integration: onay aktifleşince doğru alıcıya bildirim"
      - "fitness: notification modülü approval tablolarını import etmiyor"
      - "contract: NotificationChannelPort'a ikinci bir (fake e-posta) adapter eklendiğinde domain kodu DEĞİŞMİYOR"
    edge_cases:
      - "Role atanmış step → roldeki tüm aktif üyelere bildirim"
      - "Alıcının membership'i suspend olduysa bildirim üretilmemeli"
      - "Aynı kullanıcıya farklı olaylardan aynı anda bildirim (dedup key doğru olmalı)"
    dependencies: [FP-E09-005]
    definition_of_done:
      - "Dedup testi geçiyor"
      - "Modül bağımsızlığı fitness check ile kanıtlı"
    complexity: M
    status: draft

