# FlowPilot — İlk Dikey Dilim: Satın Alma Talebi
#
# Bu dosya, ilk dikey dilimin makine tarafından okunabilir story backlog'udur.
# Epic tanımları: docs/backlog/epics.yaml
#
# BAĞLAYICI KAPSAM KAYNAĞI: docs/product/mvp-scope-v0.1.md (owner-approved)
# Diğer bağlayıcı kaynaklar: docs/adr/*, .claude/rules/*, docs/FlowPilot_Teknik_PRD_v0.2_Agent_Ready.md
#
# KURALLAR:
#   - complexity yalnızca XS | S | M | L olabilir. XL YASAK.
#   - Story "ready" değilse agent implementasyona BAŞLAMAZ.
#   - Açık karar kilidi olan story "blocked" durumundadır.
#   - Bu dosyadaki hiçbir story şu an implemente edilmemiştir. Repository bootstrap komutu bekleniyor.

meta:
  version: "0.2"
  created_at: "2026-07-14"
  updated_at: "2026-07-14"     # owner kararları işlendi (Supabase Auth, 3 kademeli eşik, port zorunlulukları)
  scope_source: docs/product/mvp-scope-v0.1.md
  slice: purchase-request
  flow: >
    Kullanıcı giriş yapar → organizasyon ve membership belirlenir → satın alma talebi oluşturur
    (ürün/hizmet adı, kategori, tutar, para birimi, gerekçe, isteğe bağlı dosya) →
    tutar güvenli ve deterministik condition evaluator ile değerlendirilir → talep sıralı onaya gider →
    yetkili onaylar/reddeder/değişiklik ister → workflow instance doğru state transition ile ilerler →
    in-app notification oluşur → kritik işlemler audit log'a yazılır → instance timeline görüntülenir.
    Duplicate approval, duplicate event ve cross-tenant erişim engellenir.
  invariants_reference: docs/architecture/domain-boundaries.md#4-sistem-geneli-invariantlar
  personas:
    requester: "Çalışan / talep sahibi"
    approver: "Onaycı (ekip yöneticisi, finans yöneticisi)"
    process_owner: "Süreç sahibi (satın alma / finans uzmanı)"
    org_admin: "Organizasyon yöneticisi"
    engineer: "Solo developer + AI coding agent"

stories:

  # ==========================================================================
  # E00 — Repository Governance
  # ==========================================================================

  - id: FP-E00-001
    title: Governance ve agent talimat dosyaları
    epic_id: E00
    persona: engineer
    user_story: >
      Bir AI coding agent olarak, hangi kuralların bağlayıcı olduğunu ve hangi kararların
      kilitli olduğunu tek bir yerden okumak istiyorum; böylece kapsam dışına taşmadan
      ve karar uydurmadan çalışabilirim.
    business_value: >
      Agent'in yanlış varsayımla üretim kodu yazmasını engeller. Yeniden çalışma maliyetini düşürür.
    scope:
      - CLAUDE.md (kısa, günlük geliştirme odaklı)
      - AGENTS.md (çalışma protokolü, otonomi sınırları, teslim raporu)
      - .claude/rules/{architecture,security,testing,database,git-workflow}.md
      - Karar kilidi tablosu (LOCK-001..008)
    out_of_scope:
      - Repository scaffold, dependency, CI, Dockerfile
      - PRD'nin CLAUDE.md içine kopyalanması
    acceptance_criteria:
      - id: AC-1
        given: "Agent yeni bir göreve başladığında"
        when: "CLAUDE.md okunduğunda"
        then: "Kaynak öncelik sırası, aktif ADR'ler, karar kilitleri ve yasaklı davranışlar net görünür"
      - id: AC-2
        given: "Bir karar kilidi açıkken"
        when: "Agent o alanda üretim kodu yazmayı denediğinde"
        then: "AGENTS.md bunu açıkça yasaklar ve spike/ADR yolunu gösterir"
    domain_rules:
      - "Kaynak öncelik sırasında güvenlik > ADR > PRD > sözleşme > invariant > story"
      - "Mevcut kod, üstteki bir kaynakla çeliştiğinde 'doğru' kabul edilmez"
    security_requirements:
      - "Yasaklı davranış listesi secret commit ve güvenlik kontrolü kapatmayı içerir"
    audit_requirements: []
    observability_requirements: []
    api_impact: none
    data_model_impact: none
    test_cases:
      - "Manuel review: her kural dosyası bir bağlayıcı kaynağa (PRD bölümü / ADR) referans veriyor"
    edge_cases:
      - "CLAUDE.md ile AGENTS.md çelişirse AGENTS.md bağlayıcıdır (AGENTS.md'de açıkça yazılı)"
    dependencies: []
    definition_of_done:
      - "Tüm governance dosyaları mevcut"
      - "Karar kilitleri güncel durumlarıyla listeli"
      - "Career Copilot bağımsızlığı açıkça yazılı"
    complexity: S
    status: done

  - id: FP-E00-002
    title: ADR süreci ve karar kaydı disiplini
    epic_id: E00
    persona: engineer
    user_story: >
      Bir geliştirici olarak, mimari kararların neden verildiğini ve hangi kilidi kapattığını
      izlemek istiyorum; böylece karar değiştiğinde geçmiş gerekçe kaybolmasın.
    business_value: "Kararların geri döndürülebilirliğini ve devredilebilirliğini sağlar."
    scope:
      - docs/adr/README.md — süreç, durumlar, kayıt tablosu, şablon
      - ADR-001..ADR-008
      - "Her ADR'de: bağlam, seçenekler, karar, gerekçe, sonuçlar, uyum kuralları, yeniden değerlendirme tetikleyicileri"
    out_of_scope:
      - Açık kararların bu aşamada verilmesi (LOCK-004, LOCK-006, LOCK-007)
    acceptance_criteria:
      - id: AC-1
        given: "Bir mimari karar değiştiğinde"
        when: "Yeni ADR yazıldığında"
        then: "Eski ADR silinmez; 'Superseded by ADR-xxx' olarak işaretlenir"
      - id: AC-2
        given: "Bir ADR Proposed durumdayken"
        when: "Agent o karara dayanan üretim kodu yazmayı denediğinde"
        then: "Engellenir; karar owner onayı bekler"
    domain_rules:
      - "ADR durumları: Proposed | Accepted | Accepted (conditional) | Superseded | Rejected"
      - "Proposed ADR üretim kodu için dayanak oluşturamaz"
    security_requirements: []
    audit_requirements:
      - "Karar değişikliği ADR geçmişinde izlenebilir"
    observability_requirements: []
    api_impact: none
    data_model_impact: none
    test_cases:
      - "Her ADR bir durum, tarih ve (varsa) kapattığı kilidi belirtiyor"
      - "docs/adr/README.md kayıt tablosu ADR dosyalarıyla tutarlı"
    edge_cases:
      - "Bir ADR koşullu kabul edildiğinde (ADR-004) koşulun ne olduğu ve nerede doğrulanacağı açıkça yazılı"
    dependencies: [FP-E00-001]
    definition_of_done:
      - "8 ADR yazıldı ve kayıt tablosuna işlendi"
      - "Açık kilitler open-questions.md ile bağlandı"
    complexity: S
    status: done

  # ==========================================================================
  # E01 — Authentication Boundary   (LOCK-004 KAPANDI — Supabase Auth, ADR-005)
  # ==========================================================================

  - id: FP-E01-001
    title: Auth provider kararı (Supabase Auth seçildi)
    epic_id: E01
    persona: org_admin
    user_story: >
      Ürün sahibi olarak, kimlik doğrulama sağlayıcısını KVKK, maliyet, lock-in ve local
      development kriterleriyle seçmek istiyorum; böylece geri dönüşü pahalı bir bağımlılığa
      farkında olmadan girmeyeyim.
    business_value: >
      Veri yerleşimi (KVKK) itirazına cevap verebilme ve provider değiştirebilme özgürlüğü.
    scope:
      - ADR-005 karşılaştırma matrisi (11 kriter)
      - Öneri ve gerekçe
      - Owner kararı
    out_of_scope:
      - Gerçek provider entegrasyonu (FP-E01-002)
      - SSO/SCIM
    acceptance_criteria:
      - id: AC-1
        given: "İki aday aynı 11 kriterle puanlandığında"
        when: "ADR-005 okunduğunda"
        then: "Bir öneri ve o önerinin hangi koşulda değişeceği net görünür"
      - id: AC-2
        given: "Karar verildiğinde"
        when: "ADR-005 Accepted olduğunda"
        then: "LOCK-004 kapanır; Supabase yalnız AuthProviderPort adapter'ı olarak kullanılabilir"
    domain_rules:
      - "Supabase YALNIZCA authentication sağlayıcısıdır"
      - "Organization, membership, manager hierarchy, RBAC, authorization ve tenant modeli FlowPilot domain'inde ve FlowPilot'ın PostgreSQL'indedir"
      - "Supabase'in organizations/roles özelliklerine bağımlılık kurulamaz"
    security_requirements:
      - "In-house auth yazılmaz (parola hash, reset token, MFA provider sorumluluğundadır)"
    audit_requirements: []
    observability_requirements: []
    api_impact: none
    data_model_impact: none
    test_cases: []
    edge_cases:
      - "Pilot müşteri SSO/SCIM şart koşarsa Supabase kurumsal kademesi maliyet olarak yeniden değerlendirilir"
    dependencies: [FP-E00-002]
    definition_of_done:
      - "Owner kararı verildi: Supabase Auth"
      - "ADR-005 Accepted; LOCK-004 kapandı"
      - "OQ-001 kapandı"
    complexity: S
    status: done             # ✅ 2026-07-14 — owner kararı: Supabase Auth

  - id: FP-E01-002
    title: AuthProviderPort sözleşmesi, Supabase adapter ve token doğrulama
    epic_id: E01
    persona: engineer
    user_story: >
      Bir geliştirici olarak, kimlik doğrulamayı bir port arkasına almak istiyorum; böylece
      Supabase'i sonradan değiştirmek gerekirse domain kodu değişmesin.
    business_value: "Provider bağımsızlığı; lock-in maliyetinin düşürülmesi."
    scope:
      - AuthProviderPort sözleşmesi (token doğrulama, kullanıcı kimliği çözümleme)
      - Supabase adapter (JWKS ile imza doğrulama; issuer, audience, expiry kontrolü)
      - Fake adapter (local/test)
      - Contract test seti (Supabase adapter ve fake adapter AYNI seti geçer)
    out_of_scope:
      - Supabase'in organizations/roles/RBAC özellikleri (KULLANILMAZ)
      - Supabase veritabanının FlowPilot operasyonel DB'si olarak kullanılması (YASAK)
      - MFA, SSO, device management
    acceptance_criteria:
      - id: AC-1
        given: "Geçersiz imzalı, süresi dolmuş veya yanlış audience'lı bir token geldiğinde"
        when: "İstek doğrulandığında"
        then: "401 döner; hiçbir tenant verisine erişilmez; güvenlik log'una yazılır"
      - id: AC-2
        given: "Geçerli bir token geldiğinde"
        when: "Actor çözümlendiğinde"
        then: "Provider sub claim'i users.external_auth_id'ye eşlenir; e-posta primary key olarak kullanılmaz"
      - id: AC-3
        given: "E-postası doğrulanmamış bir kullanıcı"
        when: "Tenant verisine erişmeyi denediğinde"
        then: "Reddedilir"
    domain_rules:
      - "Doğrulanmamış claim yetki kaynağı olamaz"
      - "Supabase SDK'sı YALNIZ adapter katmanında bulunur; domain'e sızamaz"
      - "Supabase'in veritabanı/RLS'i FlowPilot'ın operasyonel veritabanı olarak KULLANILAMAZ"
    security_requirements:
      - "Token her istekte doğrulanır (JWKS imza, issuer, audience, expiry)"
      - "Fake adapter production konfigürasyonunda kullanılamaz (build-time/config guard)"
      - "Supabase service_role key backend'de saklanır, frontend'e ASLA gitmez"
    audit_requirements:
      - "Başarılı ve başarısız kimlik doğrulama audit'e yazılır"
    observability_requirements:
      - "auth_token_validation_total{result} metriği"
      - "Her istekte request_id/correlation_id"
    api_impact: "Tüm korumalı endpoint'ler Authorization header bekler"
    data_model_impact: "users tablosu: id, external_auth_id (Supabase sub, unique), email, email_verified_at"
    test_cases:
      - "unit: token doğrulama (geçersiz imza, expired, yanlış issuer, yanlış audience)"
      - "contract: fake adapter ve Supabase adapter AYNI contract test setini geçer"
      - "integration: doğrulanmamış e-posta ile tenant verisine erişim reddedilir"
      - "security: token olmadan korumalı endpoint 401"
      - "fitness: domain katmanında Supabase SDK importu yok"
    edge_cases:
      - "JWKS anahtar rotasyonu sırasında eski anahtarla imzalanmış geçerli token"
      - "Aynı e-posta ile farklı Supabase hesabı (external_auth_id farklı) → farklı kullanıcı"
      - "Clock skew (token nbf/exp sınırında)"
      - "Supabase erişilemezse: token offline (JWKS cache ile) doğrulanabilmeli — her istekte Supabase'e çağrı YAPILMAZ"
    dependencies: [FP-E01-001]
    definition_of_done:
      - "Port + Supabase adapter + fake adapter + contract test seti tamam"
      - "Domain'de Supabase SDK importu yok (fitness check geçiyor)"
      - "Negatif auth testleri geçiyor"
    complexity: M
    status: draft            # LOCK-004 kapandı; bootstrap onayı bekliyor

  - id: FP-E01-003
    title: Actor context çözümleme ve session boundary
    epic_id: E01
    persona: engineer
    user_story: >
      Bir geliştirici olarak, doğrulanmış token'dan actor ve tenant bağlamını tek bir yerde
      çözmek istiyorum; böylece her handler bunu yeniden ve hatalı şekilde yapmasın.
    business_value: "Tenant sızıntısının en yaygın kaynağını (dağınık context çözümleme) ortadan kaldırır."
    scope:
      - Actor (user | system | worker) modeli
      - Token → user → membership → TenantContext zinciri
      - Request ve worker giriş noktalarında bir kez çözümleme
    out_of_scope:
      - Impersonation / support access
      - API key ile makine erişimi
    acceptance_criteria:
      - id: AC-1
        given: "Bir istek geldiğinde"
        when: "Actor context çözümlendiğinde"
        then: "Tenant kimliği YALNIZCA doğrulanmış token → membership zincirinden gelir; istek gövdesinden veya query parametresinden ASLA okunmaz"
      - id: AC-2
        given: "Kullanıcı birden fazla organizasyona üyeyken"
        when: "Aktif organizasyon seçildiğinde"
        then: "Seçim membership ile doğrulanır; üye olmadığı organizasyon seçilemez"
      - id: AC-3
        given: "Bir worker outbox event işlerken"
        when: "Tenant context kurulduğunda"
        then: "Context event payload'ındaki tenant_id'den kurulur ve RLS'e tabi olur"
    domain_rules:
      - "Actor ≠ Requester (PRD §34)"
      - "Worker da tenant context ile çalışır; BYPASSRLS kullanmaz"
    security_requirements:
      - "İstemciden gelen tenant_id değeri güvenilir kabul edilemez"
      - "Üye olunmayan tenant'a geçiş 403 üretir ve audit'e yazılır"
    audit_requirements:
      - "Yetkisiz tenant geçiş denemesi security.authorization.denied olarak kaydedilir"
    observability_requirements:
      - "Her log satırında tenant_id, actor_id, request_id"
    api_impact: "Aktif organizasyon seçimi için header veya session claim"
    data_model_impact: none
    test_cases:
      - "security: Tenant A üyesi, Tenant B'yi aktif organizasyon olarak seçemez"
      - "integration: worker context'i event payload'ından kurar"
      - "unit: actor tipleri (user/system/worker) doğru ayrışır"
    edge_cases:
      - "Kullanıcı hiçbir organizasyona üye değilse (yeni kayıt)"
      - "Membership suspend edildiğinde aktif session'ın davranışı"
      - "Kullanıcı iki organizasyonda farklı rollere sahipse"
    dependencies: [FP-E01-002, FP-E02-001]
    definition_of_done:
      - "TenantContext tek giriş noktasında çözülüyor"
      - "Cross-tenant negatif testler geçiyor"
      - "Membership FlowPilot DB'sinden okunuyor; Supabase'in org modeli KULLANILMIYOR"
    complexity: M
    status: draft            # LOCK-004 kapandı; bootstrap onayı bekliyor

  # ==========================================================================
  # E02 — Tenant ve Organization
  # ==========================================================================

  - id: FP-E02-001
    title: Tenant aggregate ve organizasyon oluşturma
    epic_id: E02
    persona: org_admin
    user_story: >
      Bir kullanıcı olarak, bir organizasyon oluşturmak ve otomatik olarak owner olmak istiyorum;
      böylece ekibimi davet edip süreçleri kurmaya başlayabileyim.
    business_value: "Ürüne giriş noktası. Tenant sınırı burada doğar."
    scope:
      - Tenant aggregate (id, name, status, default_timezone, default_currency)
      - Organizasyon oluşturma → oluşturan kullanıcıya owner membership (atomik)
      - "Tenant status: active | scheduled_for_deletion"
    out_of_scope:
      - Owner transfer, tenant silme saga'sı, billing, team/department CRUD
    acceptance_criteria:
      - id: AC-1
        given: "Doğrulanmış bir kullanıcı"
        when: "Organizasyon oluşturduğunda"
        then: "Tenant ve owner membership TEK transaction'da oluşur; biri başarısızsa hiçbiri yazılmaz"
      - id: AC-2
        given: "Bir tenant mevcutken"
        when: "Tek owner'ın membership'i kaldırılmak istendiğinde"
        then: "Reddedilir — tenant hiçbir anda owner'sız kalamaz"
    domain_rules:
      - "Bir tenant en az bir aktif owner'a sahiptir (PRD §36.1/2)"
      - "Tenant timezone yalnız gösterim ve business calendar içindir; veri UTC saklanır"
      - "Varsayılan para birimi tenant seviyesinde tanımlıdır"
    security_requirements:
      - "Organizasyon ayarlarını yalnız owner/admin değiştirebilir"
      - "Tenant oluşturma rate limit'e tabidir"
    audit_requirements:
      - "organization.created — actor, tenant_id, timestamp"
      - "Owner membership atanması audit'e yazılır"
    observability_requirements:
      - "organization_created_total metriği"
    api_impact: "POST /v1/organizations"
    data_model_impact: "tenants (id, name, status, timezone, default_currency, version, created_at); RLS politikası"
    test_cases:
      - "integration: tenant + owner membership atomik oluşur"
      - "integration: transaction ortasında hata → hiçbiri yazılmaz"
      - "unit: son owner kaldırılamaz"
      - "security: başka tenant'ın ayarları okunamaz/değiştirilemez"
    edge_cases:
      - "Aynı isimde iki organizasyon (isim unique değildir, id unique'tir)"
      - "Organizasyon oluşturma sırasında eşzamanlı çift istek (idempotency)"
    dependencies: [FP-E01-002]
    definition_of_done:
      - "Atomiklik integration testle kanıtlandı"
      - "RLS politikası mevcut ve testli"
      - "Audit kaydı yazılıyor"
    complexity: M
    status: draft

  - id: FP-E02-002
    title: Tenant-scoped repository boundary
    epic_id: E02
    persona: engineer
    user_story: >
      Bir geliştirici olarak, tenant filtresini her sorguya elle yazmak zorunda kalmamak
      istiyorum; böylece tek bir unutulmuş WHERE cümlesi veri sızıntısına dönüşmesin.
    business_value: "PRD'nin normatif kuralı: tenant filtresi geliştiricinin hatırlamasına bırakılamaz."
    scope:
      - Repository/session boundary'sinde otomatik tenant scope
      - Aggregate-specific repository pattern'i
      - Tenant context olmadan tenant tablosuna sorgu → hata
    out_of_scope:
      - RLS politikalarının kendisi (FP-E04-002)
      - Generic repository (YASAK)
    acceptance_criteria:
      - id: AC-1
        given: "Bir repository sorgusu çalıştırıldığında"
        when: "Geliştirici tenant filtresi YAZMADIĞINDA"
        then: "Filtre otomatik uygulanır; başka tenant'ın satırları asla dönmez"
      - id: AC-2
        given: "Tenant context kurulmamışken"
        when: "Tenant tablosuna sorgu çalıştırıldığında"
        then: "Kontrollü hata fırlatılır (sessizce tüm tenant'lar dönmez)"
    domain_rules:
      - "Generic repository YASAK; aggregate-specific repository kullanılır"
    security_requirements:
      - "Ham SQL yolu da tenant scope'una tabidir veya açıkça gerekçelendirilir"
      - "BYPASSRLS yetkili rol kullanılmaz"
    audit_requirements: []
    observability_requirements:
      - "Tenant context'siz sorgu denemesi warn seviyesinde loglanır"
    api_impact: none
    data_model_impact: "Tenant tablolarında tenant_id + (tenant_id, ...) composite index"
    test_cases:
      - "security: filtresiz yazılmış bir sorgu bile cross-tenant veri döndürmez"
      - "integration: context'siz sorgu hata verir"
      - "fitness: generic repository tanımı yok"
    edge_cases:
      - "Global (tenant'sız) tablolar: whitelist ile açıkça işaretlenir"
      - "Worker sorguları da context ile çalışır"
    dependencies: [FP-E02-001]
    definition_of_done:
      - "Otomatik scope kanıtlandı"
      - "Whitelist dışı tenant'sız tablo yok (fitness check)"
    complexity: M
    status: draft

  - id: FP-E02-003
    title: Money value object (minor unit + currency)
    epic_id: E02
    persona: engineer
    user_story: >
      Bir geliştirici olarak, para tutarlarını yuvarlama hatası üretmeyen bir tiple taşımak
      istiyorum; böylece onay eşiği kararları (10.000 TL sınırı) deterministik olsun.
    business_value: >
      Bir kuruşluk yuvarlama hatası, yanlış onay zincirine yönlendirme demektir — finansal
      süreçte kabul edilemez.
    scope:
      - "Money value object: amount_minor (integer) + currency (ISO-4217)"
      - Karşılaştırma, toplama; farklı para biriminde işlem → domain hatası
      - Gösterim/parse sınırında dönüşüm
    out_of_scope:
      - Kur çevrimi (multi-currency dönüşüm)
    acceptance_criteria:
      - id: AC-1
        given: "Bir tutar sisteme girdiğinde"
        when: "Saklandığında"
        then: "Integer minor unit + currency olarak saklanır; float ASLA kullanılmaz"
      - id: AC-2
        given: "İki farklı para biriminde tutar"
        when: "Toplanmak veya karşılaştırılmak istendiğinde"
        then: "Domain hatası fırlatılır; sessizce dönüştürülmez"
      - id: AC-3
        given: "Tutar tam olarak eşik değerindeyken (10.000,00 TL)"
        when: "Koşul değerlendirildiğinde"
