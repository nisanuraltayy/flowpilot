  # ==========================================================================
  # E13 — Audit Log ve Timeline
  # ==========================================================================

  - id: FP-E13-001
    title: Append-only audit servisi
    epic_id: E13
    persona: org_admin
    user_story: >
      Bir organizasyon yöneticisi olarak, kimin ne zaman hangi kararı verdiğini KANITLAYABİLMEK
      istiyorum; böylece bir anlaşmazlıkta kayıtlara güvenebileyim.
    business_value: >
      Audit log FlowPilot'ın ÜRÜN BİLEŞENİDİR, teknik bir ek değil. "Kim onayladı?" sorusuna
      kanıtla cevap veremeyen bir onay ürünü değersizdir.
    scope:
      - audit_events tablosu (append-only)
      - "Zorunlu alanlar: event_id, tenant_id, actor_type, actor_id, action, resource_type, resource_id, timestamp(UTC), request_id, metadata, reason"
      - Business transaction ile AYNI transaction'da yazım
      - Read-only sorgu API'si
      - Correction event pattern (update/delete YOK)
    out_of_scope:
      - Audit export, retention job, hash chain / bütünlük mührü (sonraki faz)
    acceptance_criteria:
      - id: AC-1
        given: "Bir business transaction başarısız olduğunda"
        when: "Rollback gerçekleştiğinde"
        then: "Audit kaydı YAZILMAZ (başarısız işlem başarılı gibi görünmez)"
      - id: AC-2
        given: "Bir audit kaydı yazıldıktan sonra"
        when: "Değiştirilmeye veya silinmeye çalışıldığında"
        then: "Engellenir; düzeltme gerekiyorsa correction event yazılır"
      - id: AC-3
        given: "audit.read permission'ı olmayan bir kullanıcı"
        when: "Audit sorguladığında"
        then: "403 alır"
    domain_rules:
      - "Audit append-only (PRD §38.12)"
      - "Audit application log'un yerine geçmez; application log da audit'in yerine geçmez"
      - "Audit event business transaction ile atomiktir (PRD §36.1/13)"
    security_requirements:
      - "Hassas değerlerin tamamı audit'e yazılmaz (maskeleme/hash)"
      - "Audit tablosuna UPDATE/DELETE kod yolu yok"
    audit_requirements:
      - "Audit'in kendisi bu story'nin konusudur"
    observability_requirements:
      - "audit_event_written_total{action}"
    api_impact: "GET /v1/audit-events (cursor pagination, yetki kontrollü)"
    data_model_impact: "audit_events (append-only, RLS, (tenant_id, timestamp) index)"
    test_cases:
      - "integration: rollback → audit yazılmaz (SPK-11)"
      - "integration: audit update/delete engellenir"
      - "security: audit.read yetkisi olmayan okuyamaz"
      - "security: cross-tenant audit okunamaz"
      - "fitness: audit tablosuna UPDATE/DELETE yok"
    edge_cases:
      - "Audit yazımı başarısız olursa business transaction da başarısız olmalı (audit opsiyonel değil)"
      - "Çok büyük metadata (boyut sınırı)"
    dependencies: [FP-E09-005]
    definition_of_done:
      - "Atomiklik testi geçiyor"
      - "Append-only kanıtlandı"
    complexity: M
    status: draft

