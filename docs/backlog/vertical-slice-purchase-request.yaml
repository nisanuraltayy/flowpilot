      - "Suite her PR'da çalışır ve KAPATILAMAZ"
    audit_requirements:
      - "Her cross-tenant deneme güvenlik log'una yazılır"
    observability_requirements:
      - "Cross-tenant deneme sayısı alarm üretir"
    api_impact: none
    data_model_impact: none
    test_cases:
      - "security: her tenant-scoped kaynak için okuma/yazma/karar denemesi reddedilir"
      - "security: dosya indirme cross-tenant reddedilir"
      - "security: dashboard başka tenant verisini saymaz"
    edge_cases:
