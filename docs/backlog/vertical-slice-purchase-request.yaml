        given: "Bir instance iptal edildiğinde"
        when: "İptal işlendiğinde"
        then: "Açık task, approval step ve timer'lar cancelled olarak kapatılır"
      - id: AC-4
        given: "Eşzamanlı iki yazma"
        when: "İkisi de commit etmeye çalıştığında"
        then: "Biri 409/412 alır; sessiz overwrite yok (SPK-12)"
    domain_rules:
      - "Terminal instance yeni node başlatamaz"
      - "Terminal task yeniden tamamlanamaz"
      - "Idempotency işareti side effect ile AYNI transaction'da yazılır"
    security_requirements:
      - "Guard'lar API katmanında DEĞİL, domain katmanında; event handler arka kapıyı açamaz"
    audit_requirements:
      - "İptal edilen child resource'lar audit'e yazılır"
    observability_requirements:
      - "duplicate_event_suppressed_total; terminal_guard_rejection_total; concurrency_conflict_total"
    api_impact: "409/412 hata sözleşmesi"
    data_model_impact: "processed_events (event_id PK, handler, processed_at); timers (id, tenant_id, instance_id, fire_at, locked_until, status)"
    test_cases:
      - "integration: duplicate event → tek side effect"
      - "integration: terminal instance üç yoldan da ilerletilemez"
      - "integration: cancel → açık child resource'lar kapanır"
      - "resilience: timer restart sonrası tek kez ateşlenir"
      - "integration: eşzamanlı yazma → 409"
    edge_cases:
      - "Idempotency kaydının side effect'ten SONRA yazılması (crash → duplicate)"
      - "Timer'ın iki worker tarafından ateşlenmesi (lease)"
      - "İptal sırasında eşzamanlı onay kararı gelmesi"
    dependencies: [FP-E09-004]
    definition_of_done:
      - "SPK-06, SPK-08, SPK-09, SPK-12 davranışları üretimde de testli"
      - "FF-07 (handler idempotency) aktif"
    complexity: L
    status: blocked

  # ==========================================================================
  # E10 — Sequential Approval
  # ==========================================================================

  - id: FP-E10-001
    title: ApprovalRequest / Step / Decision domain modeli
    epic_id: E10
    persona: approver
    user_story: >
      Bir onaycı olarak, bana düşen onay adımını ve talebin tüm bağlamını görmek istiyorum;
      ve verdiğim kararın sonradan değiştirilemeyeceğinden emin olmak istiyorum.
    business_value: "Onay motoru ürünün çekirdek değeridir. Karar immutable değilse audit anlamsızdır."
    scope:
      - ApprovalRequest (node başına), ApprovalStep (sıradaki adım), ApprovalDecision (immutable karar)
      - "Step state machine: pending → active → approved | rejected | changes_requested | cancelled"
      - "Onaycı çözümleme: belirli kullanıcı veya rol"
    out_of_scope:
      - Parallel approval, quorum, delegation, yedek onaycı, eskalasyon (KAPSAM DIŞI)
    acceptance_criteria:
      - id: AC-1
        given: "Bir onay kararı verildiğinde"
        when: "Kayıt yazıldığında"
        then: "Karar IMMUTABLE'dır: karar veren, tarih, gerekçe ve hangi form snapshot'ına verildiği değiştirilemez"
      - id: AC-2
        given: "Bir approval step aktif olduğunda"
        when: "Onaycı çözümlendiğinde"
        then: "Yalnız o adıma atanmış kullanıcı/rol karar verebilir"
      - id: AC-3
        given: "Terminal bir step"
        when: "Yeni karar verilmeye çalışıldığında"
        then: "Reddedilir"
    domain_rules:
      - "ApprovalRequest ≠ ApprovalStep ≠ ApprovalDecision (PRD §34)"
      - "Karar veren actor'ün KARAR ANINDA yetkili olduğu kanıtlanır"
      - "Kullanıcı başkasının hesabıyla onay tamamlayamaz"
    security_requirements:
      - "approval.decide permission'ı + step ownership kontrolü"
      - "Yetkisiz karar denemesi 403 + audit"
    audit_requirements:
      - "approval.decided.v1 — actor, step_id, karar, gerekçe, snapshot hash, karar anındaki rol"
    observability_requirements:
      - "approval_decision_total{decision}; approval wait time"
    api_impact: "GET /v1/approvals; POST /v1/approval-steps/{stepId}/decisions"
    data_model_impact: "approval_requests, approval_steps (step_no, status, assignee_role/user, version), approval_decisions (append-only); RLS"
    test_cases:
      - "integration: karar immutable"
      - "security: atanmamış kullanıcı karar veremez"
      - "security: cross-tenant step'e karar verilemez"
      - "unit: step state machine geçişleri"
    edge_cases:
      - "Onaycının rolü karar anında değişmişse"
      - "Onaycının membership'i suspend edilmişse"
      - "Role atanmış step'te birden fazla kişi yetkiliyse (ilk karar veren kazanır — deterministik)"
    dependencies: [FP-E09-005, FP-E03-003]
    definition_of_done:
      - "Immutability ve ownership testleri geçiyor"
      - "Audit kaydı karar anındaki yetkiyi içeriyor"
    complexity: M
    status: draft

  - id: FP-E10-002
    title: Sıralı adım aktivasyonu (1-3 adımlı zincir)
    epic_id: E10
    persona: approver
    user_story: >
      Bir finans yöneticisi olarak, ekip yöneticisi onaylamadan bana onay düşmemesini istiyorum;
      ve genel müdür olarak bana yalnız 50.000 TL üzeri talepler düşsün istiyorum.
      Onay zinciri gerçekten sıralı işlemelidir.
    business_value: "Sıralı onay, satın alma sürecinin iş kuralıdır. Sıra atlanırsa kontrol kaybolur."
    scope:
      - "Zincir uzunluğu CONFIG'ten gelir: 1, 2 veya 3 adım (ASM-0001 eşiklerine göre)"
      - Sonraki step, önceki approved olmadan pending kalır
      - Onay sonrası sonraki step ATOMİK olarak aktifleşir
      - Tüm step'ler approved → instance ilerler
    out_of_scope:
      - Parallel/quorum onay
      - 3'ten fazla adım (mevcut eşik yapısı 3 kademe)
    acceptance_criteria:
      - id: AC-1
        given: "Çok adımlı sıralı onay aktifken"
        when: "Bir onaycı onay verdiğinde"
        then: "SONRAKİ step AKTİF olur ve workflow henüz TAMAMLANMAZ (instance waiting)"
      - id: AC-2
        given: "Önceki step aktifken"
        when: "Sonraki adımın onaycısı doğrudan karar vermeye çalıştığında"
        then: "403/409 ile reddedilir ve HİÇBİR karar kaydı oluşmaz"
      - id: AC-3
        given: "SON step onaylandığında"
        when: "Workflow ilerlediğinde"
        then: "Instance completed olur ve talep approved durumuna geçer"
      - id: AC-4
        given: "Bir onay verildiğinde"
        when: "Sonraki step aktivasyonu yazıldığında"
        then: "Karar + step aktivasyonu + outbox + audit AYNI transaction'dadır (step asılı kalmaz)"
      - id: AC-5
        given: "Farklı tutarlarda talepler (5.000 / 25.000 / 75.000 TL)"
        when: "Onay zinciri kurulduğunda"
        then: "Sırasıyla 1, 2 ve 3 adımlı zincir oluşur; adım sayısı KODA GÖMÜLÜ DEĞİL, config'ten gelir"
    domain_rules:
      - "Bir step tamamlanmadan sonraki AKTİF OLMAZ (SPK-04)"
      - "Sonraki step aktivasyonu transaction dışında yapılamaz — aksi hâlde süreç sessizce asılı kalır"
      - "Zincir uzunluğu Sequential Approval node config'inden okunur; 1-3 adım desteklenir (ASM-0001)"
    security_requirements:
      - "Erken karar denemesi audit'e yazılır"
      - "Her adımın onaycısı yalnız KENDİ adımına karar verebilir"
    audit_requirements:
      - "workflow.node.entered / completed; approval step aktivasyonu"
    observability_requirements:
      - "approval_step_activated_total{step_no}; adım bazında bekleme süresi"
    api_impact: none
    data_model_impact: "approval_steps.step_no + status; unique(approval_request_id, step_no)"
    test_cases:
      - "integration: erken karar reddedilir (SPK-04)"
      - "integration: 3 adımlı zincirde 1. onay → 2. step aktif, 3. hâlâ pending"
      - "integration: son onay → instance completed"
      - "integration: aktivasyon ile karar aynı transaction'da (fault injection ile kanıt)"
      - "integration: 5.000 / 25.000 / 75.000 TL → 1 / 2 / 3 adımlı zincir"
      - "fitness: adım sayısı domain kodunda hard-code edilmemiş"
    edge_cases:
      - "Tek adımlı onay zinciri (< 10.000 TL yolu)"
      - "İlk step reddedilirse sonrakiler hiç aktifleşmez"
      - "3. adımın onaycısı (genel müdür) yoksa → kontrollü hata/incident; süreç asılı kalmaz"
      - "Aktivasyon event'i duplicate işlenirse (idempotent)"
    dependencies: [FP-E10-001]
    definition_of_done:
      - "Sıra atlanamıyor VE sıra asılı kalmıyor (iki yönlü test)"
      - "1, 2 ve 3 adımlı zincirler testli"
      - "Adım sayısı config'ten geliyor (hard-code değil)"
    complexity: M
    status: draft

  - id: FP-E10-003
    title: Approve / Reject / Changes requested kararları
    epic_id: E10
    persona: approver
    user_story: >
      Bir onaycı olarak, onaylamanın yanında reddetme ve değişiklik isteme seçeneklerine
      sahip olmak istiyorum; böylece eksik bir talebi reddetmek zorunda kalmayayım.
    business_value: "Gerçek onay süreçleri 'onayla/reddet' ikilisinden ibaret değildir (PRD §9.9)."
    scope:
      - approved → sonraki step veya instance completed
      - rejected → instance rejected (terminal); gerekçe ZORUNLU
      - changes_requested → requester'a düzenleme görevi; talep changes_requested durumuna geçer
      - Revizyon sonrası yeniden onaya gönderme (yeni snapshot, onay zinciri baştan)
    out_of_scope:
      - Kısmi revizyon (yalnız belirli alanların açılması ince ayarı sonraki faz)
    acceptance_criteria:
      - id: AC-1
        given: "Bir onaycı reddettiğinde"
        when: "Gerekçe girilmediğinde"
        then: "Reddedilir — ret gerekçesi zorunludur"
      - id: AC-2
        given: "Bir onaycı değişiklik istediğinde"
        when: "Karar işlendiğinde"
        then: "Requester'a düzenleme görevi oluşur; talep changes_requested olur; bekleyen diğer step'ler beklemede kalır"
      - id: AC-3
        given: "Talep revize edilip yeniden gönderildiğinde"
        when: "Yeni snapshot oluştuğunda"
        then: "Onay zinciri yeniden değerlendirilir (tutar değiştiyse koşul yeniden çalışır) ve ÖNCEKİ onaylar geçersiz olur"
      - id: AC-4
        given: "Bir talep reddedildiğinde"
        when: "Instance terminal olduğunda"
        then: "Yeni node başlatılamaz; açık task/timer'lar kapatılır"
    domain_rules:
      - "Onay sonrasında kritik form alanı değişirse önceki onay GEÇERSİZ olur (PRD §9.9)"
      - "Değişiklik talebi, talep sahibine düzenleme görevi oluşturur"
      - "rejected terminaldir"
    security_requirements:
      - "Yalnız aktif step'in yetkili onaycısı karar verebilir"
      - "Requester yalnız kendisine açılan alanları düzenleyebilir"
    audit_requirements:
      - "approval.decided.v1 (approved|rejected|changes_requested) — gerekçe dahil"
      - "Revizyon sonrası önceki onayların geçersiz kılınması audit'e yazılır"
    observability_requirements:
      - "approval_decision_total{decision}; rework/revizyon oranı"
    api_impact: "POST /v1/approval-steps/{stepId}/decisions {decision, reason}"
    data_model_impact: "approval_decisions.reason NOT NULL (rejected/changes_requested için)"
    test_cases:
      - "integration: gerekçesiz ret reddedilir"
      - "integration: changes_requested → requester'a task"
      - "integration: revizyon sonrası tutar değişirse onay zinciri yeniden hesaplanır"
      - "integration: rejected instance terminal (yeni node yok)"
      - "security: requester izin verilmeyen alanı düzenleyemez"
    edge_cases:
      - "Revizyon sonrası tutar eşiğin altına düşerse (2 adımlı zincir 1 adıma iner)"
      - "changes_requested sonrası requester hiç yanıt vermezse (talep açık kalır — SLA MVP dışı)"
      - "Aynı anda hem onay hem değişiklik talebi gelmesi (yarış → tek karar)"
    dependencies: [FP-E10-002]
    definition_of_done:
      - "Üç karar yolu da testli"
      - "Revizyon sonrası önceki onayın geçersizliği kanıtlandı"
    complexity: M
    status: draft

  - id: FP-E10-004
    title: Duplicate approval ve self-approval koruması
    epic_id: E10
    persona: approver
    user_story: >
      Bir onaycı olarak, yanlışlıkla iki kez tıkladığımda iki karar oluşmamasını istiyorum;
      ve bir talep sahibi olarak kendi talebimi onaylayamamalıyım.
    business_value: >
      Çift onay ve self-approval, finansal bir süreçte doğrudan kontrol ihlalidir.
      Bu iki koruma ürünün denetlenebilirlik iddiasının temelidir.
    scope:
      - "Duplicate approval koruması: DB-level unique constraint + optimistic lock"
      - Self-approval engeli (policy açıkken requester kendi adımını onaylayamaz)
      - Alternate assignee davranışı (requester onaycı ise adım bir üst yetkiliye gider)
    out_of_scope:
      - Dört göz prensibi, MFA gerektiren kritik onay
    acceptance_criteria:
      - id: AC-1
        given: "Aynı onaycı aynı step'e EŞZAMANLI iki karar gönderdiğinde (çift tıklama / iki cihaz)"
        when: "İkisi de işlendiğinde"
        then: "TEK karar oluşur; tek state transition; tek notification; ikinci istek idempotent sonuç veya 409 alır"
      - id: AC-2
        given: "Self-approval politikası açıkken"
        when: "Requester kendi talebinin onay adımına karar vermeye çalıştığında"
        then: "Reddedilir; audit'e yazılır"
      - id: AC-3
        given: "Requester'ın kendisi onaycı rolündeyken"
        when: "Onay zinciri kurulduğunda"
        then: "Adım alternate assignee'ye (üst yetkili) yönlendirilir; süreç asılı KALMAZ"
    domain_rules:
      - "Bir approval step için TEK geçerli aktif karar bulunur (PRD §36.1/7)"
      - "Riskli/finansal süreçlerde 'talep sahibi kendi talebini onaylayamaz' kuralı desteklenir"
      - "Koruma uygulama seviyesinde 'önce oku, yoksa yaz' ile YAPILAMAZ — DB düzeyinde olmalı"
    security_requirements:
      - "Unique constraint: approval_step_id başına tek terminal decision"
      - "Optimistic lock ile yarış koşulu koruması"
      - "Idempotency-Key desteği"
    audit_requirements:
      - "Duplicate karar denemesi ve self-approval denemesi audit'e yazılır"
    observability_requirements:
      - "duplicate_decision_rejected_total; self_approval_blocked_total"
    api_impact: "409 Conflict sözleşmesi; Idempotency-Key"
    data_model_impact: "UNIQUE(approval_step_id) WHERE status IN terminal; approval_steps.version"
    test_cases:
      - "concurrency: paralel iki istek → approval_decisions satır sayısı = 1 (SPK-05)"
      - "integration: aynı komut sıralı iki kez → idempotent"
      - "security: self-approval reddedilir"
      - "integration: requester onaycı ise alternate assignee'ye gider"
    edge_cases:
      - "İki FARKLI onaycının role-atanmış step'e eşzamanlı kararı → tek karar (ilk kazanır)"
      - "Alternate assignee de yoksa (üst yetkili yok) → kontrollü hata, süreç asılı kalmaz"
      - "Deadlock riski (kilit sırası tutarlı olmalı)"
    dependencies: [FP-E10-003]
    definition_of_done:
      - "Concurrency testi geçiyor (tek karar)"
      - "Self-approval engeli testli"
      - "Alternate assignee yolu testli"
    complexity: M
    status: draft

  # ==========================================================================
  # E11 — Task ve Inbox
  # ==========================================================================

  - id: FP-E11-001
    title: Task aggregate ve yaşam döngüsü
    epic_id: E11
    persona: requester
    user_story: >
      Bir çalışan olarak, benden bir aksiyon beklendiğinde (örn. değişiklik talebi) bunu bir
      görev olarak görmek istiyorum; böylece ne yapmam gerektiği net olsun.
    business_value: "İnsan aksiyonu bekleyen işin görünür olması — 'talep kaybolmaz' vaadinin parçası."
    scope:
      - "Task aggregate: title, description, instance/node referansı, assignee, status, due_date (opsiyonel)"
      - "Task state machine: open → in_progress → completed; open|in_progress → cancelled"
      - is_overdue TÜRETİLMİŞ alan (ayrı state DEĞİL)
      - Idempotent completion
    out_of_scope:
      - Checklist, bağımlılık, etiket, öncelik yönetimi, yorum (MVP'de minimal)
      - SLA/eskalasyon
    acceptance_criteria:
      - id: AC-1
        given: "Geçersiz bir state transition denendiğinde (örn. completed → in_progress)"
        when: "Komut işlendiğinde"
        then: "Reddedilir"
      - id: AC-2
        given: "Aynı task completion komutu iki kez gönderildiğinde"
        when: "İkincisi işlendiğinde"
        then: "İdempotent sonuç döner; workflow İKİ KEZ ilerlemez"
      - id: AC-3
        given: "Instance iptal edildiğinde"
        when: "Açık task'lar bulunduğunda"
        then: "Task'lar cancelled olur"
    domain_rules:
      - "Terminal task yeniden tamamlanamaz (PRD §36.1/6)"
      - "overdue ayrı state değil, türetilmiş alandır — aynı kavram iki yerde tutulmaz"
    security_requirements:
      - "Kullanıcı yalnız kendisine/rolüne atanmış task'ı tamamlayabilir"
    audit_requirements:
      - "task.created / assigned / completed / cancelled"
    observability_requirements:
      - "task_completed_total; task bekleme süresi"
    api_impact: "GET /v1/tasks; POST /v1/tasks/{id}/complete"
    data_model_impact: "tasks (id, tenant_id, instance_id, node_execution_id, assignee_user_id/role, status, due_at, version); RLS"
    test_cases:
      - "unit: state machine geçişleri"
      - "integration: duplicate completion idempotent"
      - "security: başkasının task'ı tamamlanamaz"
      - "security: cross-tenant task okunamaz"
      - "integration: instance cancel → task cancelled"
    edge_cases:
      - "Assignee'nin membership'i suspend olursa"
      - "Task tamamlanırken instance terminal olursa (yarış)"
    dependencies: [FP-E09-005, FP-E03-003]
    definition_of_done:
      - "State machine ve idempotency testleri geçiyor"
      - "Cross-tenant test geçiyor"
    complexity: M
    status: draft

  - id: FP-E11-002
    title: Assignee resolution (kullanıcı ve rol)
    epic_id: E11
    persona: process_owner
    user_story: >
      Bir süreç sahibi olarak, onayı bir kişiye değil bir role atamak istiyorum; böylece
      kişi izne çıktığında süreç durmasın.
    business_value: "Rol bazlı atama, kişiye bağımlılığı kırar (PRD §9.8)."
    scope:
      - "Atama stratejileri (ilk dilim): belirli kullanıcı, belirli rol"
      - Aktif ve yetkili assignee çözümleme (suspended üye atanamaz)
      - Assignee bulunamazsa kontrollü hata (süreç asılı kalmaz)
    out_of_scope:
      - Round-robin, en az iş yükü, requester'ın yöneticisi hiyerarşisi, dinamik expression (sonraki faz)
    acceptance_criteria:
      - id: AC-1
        given: "Bir role atanmış task/approval step"
        when: "Assignee çözümlendiğinde"
        then: "O roldeki AKTİF üyeler yetkilidir; suspended/removed üyeler değildir"
      - id: AC-2
        given: "Hiçbir aktif assignee bulunamadığında"
        when: "Node çalıştırıldığında"
        then: "Kontrollü hata/incident üretilir; süreç SESSİZCE ASILI KALMAZ"
    domain_rules:
      - "Assignee yalnız aynı tenant'ın aktif üyesi olabilir"
    security_requirements:
      - "Cross-tenant assignee ataması reddedilir"
    audit_requirements:
      - "task.assigned — çözümlenen assignee ve strateji"
    observability_requirements:
      - "assignee_resolution_failed_total (alarm)"
    api_impact: none
    data_model_impact: "task_assignments veya tasks.assignee_role_id"
    test_cases:
      - "integration: role atanmış adımda yalnız aktif üyeler yetkili"
      - "integration: assignee bulunamazsa incident"
      - "security: cross-tenant assignee reddedilir"
    edge_cases:
      - "Rolde hiç aktif üye kalmaması"
      - "Rolde tek üye var ve o da requester (self-approval → alternate assignee)"
    dependencies: [FP-E11-001]
    definition_of_done:
      - "Assignee bulunamama senaryosu incident üretiyor (asılı kalmıyor)"
    complexity: M
    status: draft

  - id: FP-E11-003
    title: Kişisel task ve approval inbox'ı
    epic_id: E11
    persona: approver
    user_story: >
      Bir onaycı olarak, bekleyen onaylarımı tek ekranda görmek istiyorum; böylece
      e-postada kaybolmasınlar.
    business_value: "Ürünün ana günlük kullanım yüzeyi. 'Onaylar e-postada dağılmaz' vaadi."
    scope:
      - GET /v1/tasks ve GET /v1/approvals — yalnız yetkili kayıtlar
      - Cursor pagination + server-side max page size
      - Temel filtreler (durum, tarih) — allowlist'li
      - "Ekran state'leri: loading, empty, permission-denied, error"
    out_of_scope:
      - Saved views, gelişmiş filtre, toplu onay, arama
    acceptance_criteria:
      - id: AC-1
        given: "Bir kullanıcı inbox'ını açtığında"
        when: "Liste döndüğünde"
        then: "Yalnız kendisine/rolüne atanmış ve yetkili olduğu kayıtlar görünür"
      - id: AC-2
        given: "Çok sayıda kayıt olduğunda"
        when: "Liste istendiğinde"
        then: "Cursor pagination kullanılır; sınırsız liste DÖNMEZ"
      - id: AC-3
