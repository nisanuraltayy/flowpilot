  # ==========================================================================
  # E03 — Membership ve RBAC
  # ==========================================================================

  - id: FP-E03-001
    title: Membership yaşam döngüsü
    epic_id: E03
    persona: org_admin
    user_story: >
      Bir organizasyon yöneticisi olarak, üyeleri davet etmek ve üyelik durumlarını yönetmek
      istiyorum; böylece yalnız yetkili kişiler organizasyon verisine erişsin.
    business_value: "Tenant erişim sınırının kaynağı membership'tir."
    scope:
      - "Membership aggregate: user_id, tenant_id, role, status"
      - "Status: invited | active | suspended | removed"
      - Davet oluşturma, kabul, süre dolumu
    out_of_scope:
      - Team/department hiyerarşisi, manager hierarchy (ilk dilimde onaycı rol ile çözülür)
      - SCIM provisioning
    acceptance_criteria:
      - id: AC-1
        given: "Bir davet gönderildiğinde"
        when: "Davet süresi dolduğunda"
        then: "Davet kabul edilemez; yeniden gönderim gerekir"
      - id: AC-2
        given: "Bir davet Tenant A için oluşturulduğunda"
        when: "Farklı bir tenant bağlamında kabul edilmeye çalışıldığında"
        then: "Reddedilir"
      - id: AC-3
        given: "Bir üyelik suspended olduğunda"
        when: "Kullanıcı tenant verisine erişmeye çalıştığında"
        then: "Reddedilir; aktif oturumu da etkiler"
      - id: AC-4
        given: "Aynı e-posta iki farklı organizasyonda üye olduğunda"
        when: "Roller farklı olduğunda"
        then: "Her tenant'ta kendi rolüyle çalışır; roller birbirine sızmaz"
    domain_rules:
      - "Rol global kullanıcıya değil, membership'e yazılır (PRD §34)"
      - "Tenant hiçbir anda owner'sız kalamaz"
    security_requirements:
      - "Davet token'ı tek kullanımlık ve kısa ömürlüdür"
      - "Account enumeration yapılmaz"
      - "Üyelik değişikliği yalnız owner/admin tarafından yapılabilir"
    audit_requirements:
      - "membership.invited / accepted / suspended / removed — actor, before/after rol"
    observability_requirements:
      - "membership_status_change_total{from,to}"
    api_impact: "POST /v1/organizations/{orgId}/invites; GET /v1/organizations/{orgId}/members"
    data_model_impact: "memberships (id, tenant_id, user_id, role_id, status, version); unique(tenant_id, user_id); RLS"
    test_cases:
      - "integration: süresi dolmuş davet kabul edilemez"
      - "security: davet başka tenant'a kabul edilemez"
      - "security: suspended üye tenant verisine erişemez"
      - "integration: aynı e-posta iki tenant'ta farklı rollerle çalışır"
    edge_cases:
      - "Davet edilen e-posta zaten üye ise"
      - "Aynı davet iki kez kabul edilmeye çalışılırsa (idempotent)"
      - "Suspended üyeye atanmış açık task/approval'ın durumu"
    dependencies: [FP-E02-001]
    definition_of_done:
      - "Davet güvenlik testleri geçiyor"
      - "Cross-tenant davet testi geçiyor"
      - "Audit kayıtları before/after içeriyor"
    complexity: M
    status: draft

  - id: FP-E03-002
    title: Role ve permission katalogu
    epic_id: E03
    persona: engineer
    user_story: >
      Bir geliştirici olarak, yetkileri merkezi ve stabil anahtarlarla tanımlamak istiyorum;
      böylece yetki mantığı kod tabanına dağılmasın.
    business_value: "Yetki modelinin denetlenebilirliği ve genişletilebilirliği."
    scope:
      - "Sistem rolleri (ilk dilim): organization_owner, organization_admin, workflow_admin, manager, member"
      - Permission katalogu (stabil key'ler)
      - Rol → permission eşlemesi
    out_of_scope:
      - ABAC, field-level visibility, custom rol tanımlama, auditor/guest rolleri
    acceptance_criteria:
      - id: AC-1
        given: "Yeni bir permission eklendiğinde"
        when: "Merkezi katalogda tanımlı değilse"
        then: "CI fitness check başarısız olur"
      - id: AC-2
        given: "Bir rol tanımlandığında"
        when: "Permission'ları listelendiğinde"
        then: "Yalnız katalogdaki stabil key'ler kullanılır"
    domain_rules:
      - "Workflow yayınlama yetkisi (workflow.definition.publish) oluşturma yetkisinden AYRIDIR"
      - "Permission ≠ entitlement ≠ feature flag"
    security_requirements:
      - "İlk dilim permission'ları: purchase_request.create, purchase_request.read, approval.decide, workflow.definition.create, workflow.definition.publish, workflow.instance.read, task.read, audit.read, member.manage"
    audit_requirements:
      - "Rol/permission değişikliği before/after ile audit'e yazılır"
    observability_requirements: []
    api_impact: none
    data_model_impact: "roles, role_permissions (seed edilir; tenant'a özel rol MVP dışı)"
    test_cases:
      - "unit: rol → permission eşlemesi"
      - "fitness: katalog dışı permission key'i yok"
    edge_cases:
      - "Owner rolü her permission'a sahiptir ancak bu 'bypass' olarak değil, açık eşleme olarak modellenir"
    dependencies: [FP-E03-001]
    definition_of_done:
      - "Katalog seed edildi"
      - "Fitness check aktif"
    complexity: S
    status: draft

  - id: FP-E03-003
    title: Merkezi authorization policy servisi
    epic_id: E03
    persona: engineer
    user_story: >
      Bir geliştirici olarak, "bu actor bu kaynağa bu eylemi yapabilir mi?" sorusunu tek bir
      yerde sormak istiyorum; böylece controller'lara dağılmış rol kontrolleri oluşmasın.
    business_value: "Yetki ihlallerinin en yaygın sebebi olan dağınık kontrolü ortadan kaldırır."
    scope:
      - authorize(actor, action, resource) policy boundary
      - Resource ownership policy (requester kendi talebini okuyabilir)
      - Her protected endpoint bir policy adı belirtir
      - Negatif authorization test harness'ı
    out_of_scope:
      - Field-level visibility
      - Delegation
    acceptance_criteria:
      - id: AC-1
        given: "Yetkisiz bir actor"
        when: "Korumalı bir kaynağa eriştiğinde"
        then: "Reddedilir; kaynağın VARLIĞI sızdırılmaz; security.authorization.denied audit'e yazılır"
      - id: AC-2
        given: "Bir talep sahibi"
        when: "Kendi talebini okumak istediğinde"
        then: "Ownership policy'si ile izin verilir (rolü yetmese bile)"
      - id: AC-3
        given: "Bir endpoint tanımlandığında"
        when: "Authorization policy adı belirtilmediğinde"
        then: "CI fitness check başarısız olur"
    domain_rules:
      - "Onaycı yalnız kendisine/rolüne atanmış AKTİF step üzerinde karar verebilir"
      - "Controller içinde dağınık rol kontrolü YASAK"
    security_requirements:
      - "Yetkisiz butonu UI'da gizlemek yeterli değildir; backend enforcement zorunlu"
      - "Her yetki reddi güvenlik log'una yazılır"
    audit_requirements:
      - "security.authorization.denied.v1 — actor, action, resource_type, resource_id"
    observability_requirements:
      - "authorization_denied_total{action} metriği ve anomali alarmı"
    api_impact: "Tüm korumalı endpoint'ler policy adı ile işaretlenir"
    data_model_impact: none
    test_cases:
      - "security: her korumalı endpoint için en az bir NEGATİF authorization testi"
      - "security: member rolü başkasının talebini okuyamaz"
      - "unit: ownership policy"
      - "fitness: policy adı olmayan endpoint yok"
    edge_cases:
      - "Actor'ün rolü karar anında değişirse (yetki cache invalidation)"
      - "Kaynak silinmiş/terminal ise yetki kontrolü hâlâ uygulanır"
    dependencies: [FP-E03-002]
    definition_of_done:
      - "Negatif authorization suite'i çalışıyor"
      - "Fitness check aktif"
      - "Yetki reddi audit'e yazılıyor"
    complexity: M
    status: draft

