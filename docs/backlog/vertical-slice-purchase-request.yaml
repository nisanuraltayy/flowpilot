  - id: FP-E08-003
    title: Spike kanıtı — eşzamanlılık ve idempotency (SPK-04, SPK-05, SPK-06, SPK-12)
    epic_id: E08
    persona: engineer
    user_story: >
      Bir geliştirici olarak, duplicate approval ve duplicate event'in tek side effect
      ürettiğini kanıtlamak istiyorum; böylece çift onay veya çift bildirim oluşmasın.
    business_value: >
      Çift onay finansal bir süreçte doğrudan zarardır. Bu, ürünün güvenilirlik iddiasının merkezi.
    scope:
      - "SPK-04: Sıralı onayda ikinci adım birinci tamamlanmadan aktif olmuyor"
      - "SPK-05: Aynı approval command iki kez → tek karar"
      - "SPK-06: Aynı outbox event iki kez → duplicate side effect yok"
      - "SPK-12: Optimistic concurrency conflict kontrollü hata üretiyor"
    out_of_scope:
      - Durability kriterleri (FP-E08-004)
    acceptance_criteria:
      - id: AC-1
        given: "İki adımlı onay zincirinde birinci adım beklerken"
        when: "İkinci onaycı doğrudan karar vermeye çalıştığında"
        then: "403/409 ile reddedilir; HİÇBİR karar kaydı oluşmaz; step pending kalır"
      - id: AC-2
        given: "Aynı approval step'e EŞZAMANLI iki karar komutu gönderildiğinde"
        when: "İkisi de işlendiğinde"
        then: "approval_decisions tablosunda TAM OLARAK BİR kayıt; tek state transition; tek notification"
      - id: AC-3
        given: "Aynı outbox event (aynı event_id) iki kez dispatch edildiğinde"
        when: "İkincisi işlendiğinde"
        then: "Hiçbir yeni side effect oluşmaz (tek notification, tek task, tek audit)"
      - id: AC-4
        given: "Aynı aggregate'e eşzamanlı iki yazma"
        when: "İkisi de commit etmeye çalıştığında"
        then: "Biri 409 alır; sessiz overwrite YOK; veri kaybı YOK"
    domain_rules:
      - "Duplicate koruması VERİTABANI düzeyinde olmalı (unique constraint + optimistic lock); uygulama seviyesinde 'önce oku, yoksa yaz' YETERSİZDİR"
      - "at-least-once + idempotent consumer; 'exactly once' iddiası YASAK"
    security_requirements:
      - "Erken karar denemesi audit'e yazılır"
    audit_requirements:
      - "Duplicate/erken karar denemeleri izlenebilir"
    observability_requirements:
      - "duplicate_command_rejected_total, concurrency_conflict_total"
    api_impact: none
    data_model_impact: "unique constraint: approval_step_id başına tek terminal decision; processed_events tablosu"
    test_cases:
      - "SPK-04: erken karar denemesi reddedilir; birinci onay sonrası ikinci step aktifleşir"
      - "SPK-05: paralel iki istek → 1 karar (DB satır sayısı = 1)"
      - "SPK-06: duplicate dispatch → side effect tablolarında satır sayısı sabit"
      - "SPK-12: eşzamanlı yazma → 409, veri kaybı yok, deadlock yok"
    edge_cases:
      - "İki FARKLI onaycının aynı step'e eşzamanlı karar vermesi"
      - "Idempotency kontrolünün side effect'ten SONRA yapılması (yanlış implementasyon)"
      - "Retry'ın conflict'i sonsuz döngüye sokması (bounded retry zorunlu)"
    dependencies: [FP-E08-002]
    definition_of_done:
      - "SPK-04, SPK-05, SPK-06, SPK-12 kanıt paketiyle geçti"
    complexity: L
    status: draft

  - id: FP-E08-004
    title: Spike kanıtı — durability, izolasyon ve atomiklik (SPK-07..SPK-11)
    epic_id: E08
    persona: engineer
    user_story: >
      Bir geliştirici olarak, worker çöktüğünde sürecin kaybolmadığını, timer'ın restart'tan
      sağ çıktığını ve state+outbox+audit'in atomik olduğunu kanıtlamak istiyorum.
    business_value: >
      "Talepler kaybolmaz" ürün vaadinin teknik karşılığı. Bu kanıtlanamazsa custom runtime
      terk edilmelidir.
    scope:
      - "SPK-07: Worker kill/restart → süreç kayıpsız"
      - "SPK-08: Persisted timer restart sonrası çalışıyor"
      - "SPK-09: Terminal instance yeni node başlatamıyor"
      - "SPK-10: Cross-tenant actor başka tenant instance'ına erişemiyor"
      - "SPK-11: State + outbox + audit aynı transaction'da tutarlı"
    out_of_scope:
      - Performans/yük testi (spike kapsamı değil)
    acceptance_criteria:
      - id: AC-1
        given: "Bir event işlenirken worker SIGKILL ile öldürüldüğünde"
        when: "Worker yeniden başlatıldığında"
        then: "Süreç doğru tamamlanır; instance asılı KALMAZ; duplicate side effect OLUŞMAZ"
      - id: AC-2
        given: "Bir timer planlandıktan sonra worker öldürüldüğünde"
        when: "Worker yeniden başlatıldığında ve vade geldiğinde"
        then: "Timer TAM OLARAK BİR KEZ ateşlenir"
      - id: AC-3
        given: "Terminal (completed/rejected/cancelled) bir instance"
        when: "Geciken bir event, API çağrısı veya timer onu ilerletmeye çalıştığında"
        then: "Kontrollü şekilde reddedilir; yeni node execution OLUŞMAZ"
      - id: AC-4
        given: "Tenant A'nın actor'ü ve Tenant B'nin instance ID'si"
        when: "Okuma/iptal/karar/timeline/dosya erişimi denendiğinde"
        then: "5/5 reddedilir; uygulama filtresi kaldırılsa bile RLS boş döndürür"
      - id: AC-5
        given: "Commit'ten hemen önce hata enjekte edildiğinde"
        when: "Transaction geri alındığında"
        then: "Ne karar, ne state, ne outbox, ne audit yazılır — HİÇBİRİ"
    domain_rules:
      - "Timer veritabanında tutulur; in-memory timer YASAK"
      - "Terminal instance yeni node başlatamaz (PRD §36.1/5)"
      - "Audit, business transaction başarısızsa yazılmaz (PRD §36.1/13)"
    security_requirements:
      - "Worker BYPASSRLS kullanmaz — en sinsi sızıntı yolu budur"
    audit_requirements:
      - "Atomiklik kanıtı: rollback sonrası audit_events BOŞ"
    observability_requirements:
      - "Timer gecikme metriği; worker lag metriği"
    api_impact: none
    data_model_impact: "timers, outbox_events, processed_events, audit_events"
    test_cases:
      - "SPK-07: SIGKILL + restart → süreç tamamlanır (kayıpsız, duplicate'siz)"
      - "SPK-08: timer restart'tan sağ çıkar, tek kez ateşlenir"
      - "SPK-09: terminal instance üç yoldan da (API/event/timer) ilerletilemez"
      - "SPK-10: cross-tenant 5/5 reddedilir + RLS tek başına çalışır + worker RLS'e tabi"
      - "SPK-11: fault injection → dört tablo da boş"
    edge_cases:
      - "Event 'işleniyor' işaretlenip crash → lease/visibility timeout ile geri alınmalı"
      - "İki worker aynı timer'ı ateşlemeye çalışırsa (lease)"
      - "Outbox event'inin after_commit hook'unda yazılması = DUAL WRITE (yanlış implementasyon)"
    dependencies: [FP-E08-003]
    definition_of_done:
      - "SPK-07..SPK-11 kanıt paketiyle geçti"
      - "12/12 kriter tamamlandı → spike raporu ve ADR-004 güncellemesi üretildi"
      - "12/12 sağlanamadıysa Temporal ADR'si açıldı"
    complexity: L
    status: draft

