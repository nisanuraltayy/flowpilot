  - id: FP-E06-003
    title: Talebe isteğe bağlı dosya eki (S3-compatible storage portu)
    epic_id: E06
    persona: requester
    user_story: >
      Bir çalışan olarak, talebe teklif/fatura dosyası eklemek istiyorum; böylece onaycı
      kararını belgeye bakarak versin.
    business_value: "Onaycının bağlama erişmesi — kararın kalitesi."
    scope:
      - FileStoragePort (S3-compatible); local development için MinIO adayı
      - MalwareScanPort — SAĞLAYICI-NÖTR port tasarımı; MVP'de yalnız no-op/stub adapter
      - scan_status alanı ve tarama tamamlanmadan indirmeyi engelleyen kapı (ŞİMDİDEN hazır)
      - Presigned upload URL + finalize command
      - MIME/boyut policy
      - Yetki kontrollü indirme
      - Document → PurchaseRequest link
    out_of_scope:
      - GERÇEK malware tarama entegrasyonu → PILOT-READY zorunlu güvenlik çıkış kriteri (ASM-0007)
      - Doküman versiyonlama, OCR, önizleme
    acceptance_criteria:
      - id: AC-1
        given: "Bir kullanıcı dosya yüklediğinde"
        when: "Upload gerçekleştiğinde"
        then: "Dosya içeriği API process memory'sinden GEÇMEZ; presigned URL kullanılır"
      - id: AC-2
        given: "Tenant A'nın kullanıcısı"
        when: "Tenant B'nin dosyasını indirmeye çalıştığında"
        then: "Reddedilir; object storage path'i tenant ile ayrılmıştır"
      - id: AC-3
        given: "İzin verilmeyen MIME tipi veya boyut sınırı aşıldığında"
        when: "Upload denendiğinde"
        then: "Reddedilir"
      - id: AC-4
        given: "Upload URL alındıktan sonra finalize edilmediğinde"
        when: "Belirli süre geçtiğinde"
        then: "Yetim (orphan) obje temizlenir veya işaretlenir"
    domain_rules:
      - "Presigned upload pattern zorunlu (PRD §38.13)"
      - "Tarama tamamlanmadan restricted dosya indirilemez — kapı MVP'de HAZIRDIR, tarama adapter'ı stub'dır"
      - "MalwareScanPort sağlayıcı-nötr; gerçek tarama eklemek bir ADAPTER işidir, refactor DEĞİL"
    security_requirements:
      - "Presigned URL kısa TTL'li"
      - "İndirme her seferinde authorization kontrolünden geçer"
      - "Object storage path'i tenant ile izole"
      - "Dosya tipi doğrulama yalnız uzantıya değil, içerik tipine de bakar"
      - "PILOT KAPISI: gerçek tarama entegre edilmeden Local MVP pilot müşteriye AÇILMAZ (ASM-0007)"
    audit_requirements:
      - "document.uploaded / document.downloaded — actor, document_id"
    observability_requirements:
      - "document_upload_total, document_download_total"
    api_impact: "POST /v1/documents/upload-url; POST /v1/documents/{id}/complete-upload; GET /v1/documents/{id}/download-url"
    data_model_impact: "documents (id, tenant_id, storage_key, mime, size_bytes, scan_status, uploaded_by); document_links (document_id, resource_type, resource_id); RLS"
    test_cases:
      - "security: cross-tenant dosya indirme reddedilir"
      - "security: yetkisiz kullanıcı indiremez"
      - "integration: MIME/boyut policy uygulanır"
      - "integration: presigned URL süresi dolduğunda upload reddedilir"
      - "contract: FileStoragePort fake ve MinIO adapter'ı aynı contract testini geçer"
    edge_cases:
      - "Upload tamamlanmadan talep gönderilirse"
      - "Aynı dosya iki kez finalize edilirse (idempotent)"
      - "Storage sağlayıcısı yanıt vermezse (timeout + kullanıcıya net hata)"
    dependencies: [FP-E06-001]
    definition_of_done:
      - "Cross-tenant dosya testi geçiyor"
      - "Presigned pattern kanıtlandı (dosya API'den geçmiyor)"
      - "Port contract testi geçiyor"
    complexity: M
    status: draft

  # ==========================================================================
  # E07 — Workflow Publish ve Versioning
  # ==========================================================================

  - id: FP-E07-001
    title: Workflow draft aggregate ve optimistic concurrency
    epic_id: E07
    persona: process_owner
    user_story: >
      Bir süreç sahibi olarak, workflow taslağını düzenlerken başka birinin değişikliğini
      sessizce ezmemek istiyorum.
    business_value: "Süreç tanımının kaybolmadan ve çakışmadan düzenlenebilmesi."
    scope:
      - WorkflowDraft aggregate (nodes, edges, config, version alanı)
      - Optimistic concurrency (409 Conflict)
      - Draft'tan yeni draft oluşturma
    out_of_scope:
      - Görsel canvas (MVP DIŞI)
      - Undo/redo, autosave UX
    acceptance_criteria:
      - id: AC-1
        given: "İki actor aynı draft'ı aynı version ile okuduğunda"
        when: "İkisi de kaydetmeye çalıştığında"
        then: "Biri başarılı olur; diğeri 409 alır; hiçbir değişiklik sessizce KAYBOLMAZ"
      - id: AC-2
        given: "Published bir workflow varken"
        when: "Yeni draft oluşturulduğunda"
        then: "Published kayıt DEĞİŞMEZ; yeni draft ayrı kayıt olur"
    domain_rules:
      - "published → draft geçişi YASAK; yeni draft ayrı kayıttır"
    security_requirements:
      - "workflow.definition.create permission'ı gerekir"
    audit_requirements:
      - "workflow.draft.created / updated"
    observability_requirements:
      - "workflow_draft_conflict_total"
    api_impact: "POST /v1/workflows/{id}/drafts; PUT /v1/workflows/{id}/drafts/{draftId} (If-Match)"
    data_model_impact: "workflows, workflow_drafts (id, tenant_id, definition JSONB, version); RLS"
    test_cases:
      - "integration: eşzamanlı düzenleme → 409, veri kaybı yok"
      - "integration: yeni draft published'ı değiştirmez"
      - "security: workflow_admin olmayan kullanıcı draft oluşturamaz"
    edge_cases:
      - "Aynı workflow'dan iki draft aynı anda oluşturulursa"
      - "Draft silinirken published version'a etkisi olmamalı"
    dependencies: [FP-E03-003]
    definition_of_done:
      - "Concurrency testi geçiyor"
      - "Published immutability korunuyor"
    complexity: M
    status: draft

  - id: FP-E07-002
    title: Node/edge şeması ve graph validation
    epic_id: E07
    persona: process_owner
    user_story: >
      Bir süreç sahibi olarak, hatalı bir süreci yayınlayamamak istiyorum; böylece çalışanların
      talepleri asılı kalmasın.
    business_value: "Bozuk workflow = asılı kalan talep = kaybolan iş. Yayın öncesi doğrulama zorunludur."
    scope:
      - "MVP node seti şeması: Start, Form, Condition, Sequential Approval, Notification, End"
      - Edge kısıtları
      - "Graph validation: yetim node, ulaşılamayan End, Start'tan erişilemeyen node, döngü"
      - Node config şeması (her node tipi için ayrı)
    out_of_scope:
      - Parallel split/join, quorum, sub-workflow, webhook, script, AI, DMN node'ları (KAPSAM DIŞI)
    acceptance_criteria:
      - id: AC-1
        given: "Bir workflow tanımında yetim node veya ulaşılamayan End bulunduğunda"
        when: "Validation çalıştığında"
        then: "Hata listesi üretilir; yayınlama ENGELLENİR"
      - id: AC-2
        given: "MVP node seti dışında bir node tipi tanımlandığında"
        when: "Validation çalıştığında"
        then: "Bilinmeyen node tipi reddedilir; yayınlanamaz"
      - id: AC-3
        given: "Bir Condition node'unda hiçbir branch eşleşmediğinde"
        when: "Validation çalıştığında"
        then: "Default branch zorunluluğu kontrol edilir (asılı kalma riski engellenir)"
    domain_rules:
      - "Bilinmeyen node türü yayınlanamaz (PRD §12)"
      - "Her node'dan End'e ulaşılabilir olmalı"
    security_requirements:
      - "Definition JSON istemciden güvenilmeden doğrulanır"
      - "Condition expression'ları güvenli DSL parser'ından geçer (eval YASAK)"
    audit_requirements: []
    observability_requirements:
      - "workflow_validation_error_total{error_type}"
    api_impact: "POST /v1/workflows/{id}/validate"
    data_model_impact: "workflow_nodes, workflow_edges (version'a bağlı, immutable)"
    test_cases:
      - "unit: yetim node tespit edilir"
      - "unit: ulaşılamayan End tespit edilir"
      - "unit: bilinmeyen node tipi reddedilir"
      - "unit: Condition'da default branch yoksa uyarı/hata"
      - "fitness: MVP node seti dışında node tipi tanımlı değil (FF-16)"
    edge_cases:
      - "Tek node'lu workflow (Start → End)"
      - "Kendine dönen edge (self-loop)"
      - "Çok büyük graph (node sayısı sınırı)"
    dependencies: [FP-E07-001]
    definition_of_done:
      - "Validation hata tipleri testli"
      - "MVP node seti fitness check'i aktif"
    complexity: M
    status: draft

  - id: FP-E07-003
    title: Workflow publish — immutable version ve hash
    epic_id: E07
    persona: process_owner
    user_story: >
      Bir süreç sahibi olarak, yayınladığım sürecin bir daha değişmeyeceğinden emin olmak
      istiyorum; böylece devam eden talepler güvende olsun ve kararlar denetlenebilsin.
    business_value: >
      PRD'nin en kritik invariant'larından biri. Published version değişirse tüm audit trail
      anlamını yitirir.
    scope:
      - "Publish komutu: validation + yetki + immutable version + hash + audit (ATOMİK)"
      - "Version durumları: draft | published | deprecated | archived"
      - Published version üzerine UPDATE yolunun kapatılması
    out_of_scope:
      - Version diff görünümü, dört göz prensibi, dry-run test modu
    acceptance_criteria:
      - id: AC-1
        given: "Bir workflow yayınlandığında"
        when: "Version kaydı oluştuğunda"
        then: "Kayıt immutable'dır; içerik hash'lenir; sonraki hiçbir işlem onu DEĞİŞTİREMEZ"
      - id: AC-2
        given: "Publish işlemi sırasında bir hata oluştuğunda"
        when: "Transaction geri alındığında"
        then: "Ne version, ne hash, ne audit kaydı yazılır (atomiklik)"
      - id: AC-3
        given: "workflow.definition.publish permission'ı olmayan bir kullanıcı"
        when: "Yayınlamayı denediğinde"
        then: "403 alır; audit'e yazılır"
      - id: AC-4
        given: "Validation hatası olan bir draft"
        when: "Yayınlanmaya çalışıldığında"
        then: "Reddedilir"
    domain_rules:
      - "Published workflow version IMMUTABLE'dır (PRD §36.1/3, ADR-004)"
      - "Yayınlama yetkisi oluşturma yetkisinden ayrıdır"
      - "Yayınlanan içerik hash'lenir; runtime hash'i doğrular"
    security_requirements:
      - "Publish permission kontrolü + audit"
      - "Published tablolara UPDATE çalıştıran kod yolu YOK (FF-11)"
    audit_requirements:
      - "workflow.definition.published.v1 — actor, version, hash"
    observability_requirements:
      - "workflow_published_total"
    api_impact: "POST /v1/workflows/{id}/publish"
    data_model_impact: "workflow_versions (id, tenant_id, workflow_id, version_no, definition JSONB, content_hash, published_by, published_at); append-only"
    test_cases:
      - "integration: published version değiştirilemez (SPK-01 ile örtüşür)"
      - "integration: publish atomik (hata → hiçbiri yazılmaz)"
      - "security: yetkisiz publish 403 + audit"
      - "fitness: FF-11 (published'a UPDATE yok)"
    edge_cases:
      - "Aynı draft iki kez yayınlanırsa (idempotent veya 409)"
      - "Eşzamanlı publish → version numarası çakışması (unique constraint)"
      - "Hash hesabının JSON key sırasına duyarlı olmaması (canonical serialization)"
    dependencies: [FP-E07-002]
    definition_of_done:
      - "Immutability testi geçiyor"
      - "Atomiklik testi geçiyor"
      - "FF-11 aktif"
    complexity: M
    status: draft

  # ==========================================================================
  # E08 — Workflow Runtime Spike   (LOCK-003 — spike geçmeden üretim kodu YASAK)
  # Plan: docs/architecture/workflow-runtime-spike-plan.md
