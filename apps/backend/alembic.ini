# FlowPilot - Alembic configuration (single migration history, ADR-009).
#
# The connection URL is NOT hard-coded here or in source code. env.py reads the
# URL from the MIGRATION_DATABASE_URL environment variable (flowpilot_migrator
# role). `sqlalchemy.url` is intentionally EMPTY; tests may override it
# programmatically. See migrations/env.py.
#
# NOTE: this file is read by configparser with the platform locale encoding, so
# it is kept ASCII-only on purpose (Turkish characters would break decoding on
# a cp1254 Windows console). Explanatory prose lives in the docs, not here.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
